[options]
; HERMES Odoo runtime configuration.
;
; This is a TEMPLATE. At container start, hermes-entrypoint.sh renders it with
; envsubst into /etc/odoo/odoo.conf using the container environment.
;
; Do not hardcode secrets here - they are injected from the environment.

admin_passwd = ${ODOO_ADMIN_PASSWD}
db_host = ${DB_HOST}
db_port = ${DB_PORT}
db_user = ${DB_USER}
db_password = ${DB_PASSWORD}
db_name = ${DB_NAME}
dbfilter = ^${DB_NAME}$

addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; Database manager is disabled in production.
list_db = False

; Trust X-Forwarded-* headers set by Caddy.
proxy_mode = True

workers = ${ODOO_WORKERS}
max_cron_threads = ${ODOO_MAX_CRON_THREADS}

limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

http_port = 8069
gevent_port = 8072
log_level = ${ODOO_LOG_LEVEL}
server_wide_modules = base,web
